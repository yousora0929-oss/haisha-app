<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>CONCRETELINK</title>
    <script src="/theme-bootstrap.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = window.__CONCRETE_LINK_TAILWIND_CONFIG || { darkMode: 'class' };
    </script>
    <link rel="stylesheet" href="/src/theme.css" />
  </head>
  <body class="min-h-[100dvh] bg-gradient-to-br from-slate-100 via-white to-indigo-50 font-sans text-slate-800 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 dark:text-slate-100">
    <main class="mx-auto flex min-h-[100dvh] w-full max-w-5xl flex-col items-center justify-center px-4 py-10">
      <section class="w-full rounded-3xl border border-slate-200 bg-white/95 p-6 text-center shadow-2xl dark:border-slate-600 dark:bg-slate-800/95 sm:p-10">
        <img src="/brand/logo-horizontal.svg" alt="CONCRETELINK" class="mx-auto h-16 w-auto dark:hidden sm:h-20" />
        <img src="/brand/logo-horizontal-dark.svg" alt="" aria-hidden="true" class="mx-auto hidden h-16 w-auto dark:block sm:h-20" />
        <p class="mx-auto mt-5 max-w-2xl text-sm font-bold leading-relaxed text-slate-500 dark:text-slate-400">
          商社・業者・工場・組合。工場から現場まで全てをリンクする。
        </p>
        <div class="mt-8 grid gap-4 md:grid-cols-3">
          <a class="rounded-2xl border-2 border-orange-200 bg-orange-50 px-4 py-5 text-left shadow-sm transition hover:bg-orange-100 active:scale-[0.98] dark:border-orange-700 dark:hover:bg-orange-950/50" href="/DispatchOrderPrototype.html">
            <span class="block text-xs font-black uppercase tracking-widest text-orange-600 dark:text-orange-300">Customer / Smartphone</span>
            <span class="mt-2 block text-lg font-black text-slate-900 dark:text-slate-100">カスタマー注文</span>
            <span class="mt-2 block text-sm font-bold text-slate-500 dark:text-slate-400">現場から片手で発注</span>
          </a>
          <a class="rounded-2xl border-2 border-indigo-200 bg-indigo-50 px-4 py-5 text-left shadow-sm transition hover:bg-indigo-100 active:scale-[0.98] dark:border-indigo-700 dark:hover:bg-indigo-950/50" href="/FactoryTabletPrototype.html">
            <span class="block text-xs font-black uppercase tracking-widest text-indigo-600 dark:text-indigo-300">Factory / Tablet</span>
            <span class="mt-2 block text-lg font-black text-slate-900 dark:text-slate-100">工場用配車モニターへ</span>
            <span class="mt-2 block text-sm font-bold text-slate-500 dark:text-slate-400">出荷室でタッチ操作</span>
          </a>
          <a class="rounded-2xl border-2 border-slate-300 bg-slate-50 px-4 py-5 text-left shadow-sm transition hover:bg-slate-100 active:scale-[0.98] dark:border-slate-600 dark:bg-slate-800 dark:hover:bg-slate-700" href="/AdminPrototype.html">
            <span class="block text-xs font-black uppercase tracking-widest text-slate-500 dark:text-slate-400">Admin / PC</span>
            <span class="mt-2 block text-lg font-black text-slate-900 dark:text-slate-100">管理者メニュー</span>
            <span class="mt-2 block text-sm font-bold text-slate-500 dark:text-slate-400">全体管理・マスタ設定</span>
          </a>
          <a class="rounded-2xl border-2 border-emerald-200 bg-emerald-50 px-4 py-5 text-left shadow-sm transition hover:bg-emerald-100 active:scale-[0.98] dark:border-emerald-700 dark:hover:bg-emerald-950/50" href="/CharterTabletPrototype.html">
            <span class="block text-xs font-black uppercase tracking-widest text-emerald-600 dark:text-emerald-300">🚛 Charter / Tablet</span>
            <span class="mt-2 block text-lg font-black text-slate-900 dark:text-slate-100">チャーター業者</span>
            <span class="mt-2 block text-sm font-bold text-slate-500 dark:text-slate-400">応援要請への応答・車両登録はこちら</span>
          </a>
        </div>
      </section>
    </main>
    <script type="module">
      import { initTheme } from '/src/utils/theme.js';
      initTheme();
    </script>
    <script>
      (function () {
        var params = new URLSearchParams(location.search || '');
        var orderId = String(params.get('orderId') || '').trim();
        if (!orderId) return;
        var app = String(params.get('app') || params.get('targetApp') || '').trim();
        var type = String(params.get('type') || '').trim();
        if (!app) {
          if (type === 'order_status') app = 'customer';
          else if (type === 'new_order' || type === 'customer_map_shared') app = 'factory';
          else if (type === 'chat') app = 'customer';
        }
        var path =
          app === 'factory'
            ? '/FactoryTabletPrototype.html'
            : app === 'customer'
              ? '/DispatchOrderPrototype.html'
              : '';
        if (!path) return;
        location.replace(path + location.search);
      })();
    </script>
  </body>
</html>
